spring:
  application:
    name: apontaja-back

  # Emplacement par défaut de Flyway (classpath:db/migration), explicité pour la lisibilité.
  # Les migrations sont la seule source de vérité du schéma (voir V1__initial_schema.sql).
  flyway:
    locations: classpath:db/migration

  # Flyway est la SEULE source de vérité sur le schéma (cf. audit §3.3 : incohérences DB entre
  # environnements dans l'ancien projet). Hibernate ne doit jamais générer/modifier le schéma :
  # validate échoue bruyamment si les entités JPA divergent du schéma Flyway, plutôt que de
  # laisser Hibernate "corriger" silencieusement en douce.
  jpa:
    hibernate:
      ddl-auto: validate

apontaja:
  security:
    jwt:
      # Placeholder de DEV et de TESTS uniquement (les ITs n'activent aucun profil) : écrasé par
      # application-local.yml (profil "local") et par application-prod.yml (profil "prod", variable
      # APONTAJA_JWT_SECRET, sans valeur par défaut). Ne jamais déployer sans le profil "prod".
      secret: "placeholder-dev-secret-never-use-in-production-32-bytes-minimum-xx"

server:
  port: 8080

